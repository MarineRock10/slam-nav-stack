# slam-nav-stack :: navigation parameters

navigation:
  planner:
    type: "astar"
    use_costmap: true
    costmap:
      inflation_radius: 0.25
      obstacle_threshold: 0.6

  controller:
    type: "follow_the_path"
    max_linear_vel: 0.8          # m/s
    max_angular_vel: 1.2         # rad/s
    goal_tolerance: 0.15         # m
    yaw_tolerance: 0.10          # rad

  waypoints:
    queue_mode: "sequence"
    on_failure: "requeue"        # requeue | abort | skip
    max_retries: 3

  watchdog:
    enable: true
    timeout_s: 5.0
    auto_recover: true

web:
  console_enabled: true          # field navigation web console (GitHub Pages)
  telemetry_rate_hz: 2.0
  auth: "none"                   # internal tooling only
