# slam-nav-stack :: graph SLAM parameters
# (tuned for 2D LiDAR indoor field navigation, 10 Hz)

slam:
  map_frame: "map"
  odom_frame: "odom"
  base_frame: "base_link"

  # --- front-end ---
  scan_topic: "/scan"
  max_range: 30.0
  min_range: 0.15
  beams: 720

  scan_matcher:
    type: "icp"
    max_iterations: 30
    max_correspondence_distance: 0.3
    epsilon: 0.0001

  # --- back-end (pose graph) ---
  graph:
    enable: true
    optimize_iterations: 20
    loop_closure:
      enable: true
      radius: 5.0
      min_score: 0.65

  # --- mapping ---
  grid:
    resolution: 0.05
    width_m: 40.0
    height_m: 40.0
    occupied_threshold: 0.6
    free_threshold: 0.2
